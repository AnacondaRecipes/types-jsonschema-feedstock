{% set name = "types-jsonschema" %}
{% set version = "4.26.0.20260518" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
    sha256: e1dd53dc97a64f5eccdd6fa9839666e09bb500a8ebba2db6fdaf1789faea81a6

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - setuptools >=82.0.1
  run:
    - python
    - referencing

test:
  imports:
    - types
  commands:
    - pip check
    - test -f $SP_DIR/jsonschema-stubs/__init__.pyi  # [unix]
    - if not exist %SP_DIR%\\jsonschema-stubs\\__init__.pyi exit 1  # [win]
  requires:
    - pip

about:
  home: https://github.com/python/typeshed
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  summary: Typing stubs for jsonschema
  description: |
    This is a PEP 561 type stub package for the jsonschema package. It can be
    used by type-checking tools like mypy, pyright, pytype, PyCharm, etc. to
    check code that uses jsonschema.
  dev_url: https://github.com/python/typeshed
  doc_url: https://python-jsonschema.readthedocs.io

extra:
  recipe-maintainers:
    - conda-forge/mypy
